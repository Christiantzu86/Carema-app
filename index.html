          var ch = findCh(props.chantiers, d.chantierId);
          var tot = calcTot(d);
          return (
            <div key={d.id} onClick={function() { setSel(d); }} style={{ background: "#fff", borderRadius: 14, padding: 16, boxShadow: "0 2px 10px #00000010", borderLeft: "4px solid " + (SC[d.status] || "#94a3b8"), cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}><div style={{ fontWeight: 800, fontSize: 15, color: "#1e3a8a" }}>{d.ref}</div><Badge status={d.status} /></div>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#374151" }}>👤 {d.client || "—"}</div>
              {ch && <div style={{ fontSize: 12, color: "#64748b" }}>🏗️ {ch.name}</div>}
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, paddingTop: 8, borderTop: "1px solid #f1f5f9" }}>
                <span style={{ fontSize: 12, color: "#64748b" }}>📅 {fmtD(d.date)} · {d.validite}j</span>
                <span style={{ fontWeight: 800, color: "#1e3a8a" }}>{fmtE(tot * 1.2)} TTC</span>
              </div>
            </div>
          );
        })}
        {props.devis.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#94a3b8" }}><div style={{ fontSize: 48 }}>📋</div><p>Aucun devis</p></div>}
      </div>
      {modal && (
        <Modal title="Nouveau devis" onClose={function() { setModal(false); }}>
          <Inp label="Client *" value={form.client} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { client: e.target.value }); }); }} placeholder="Nom du client" />
          <Sel label="Chantier" value={form.chantierId} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { chantierId: e.target.value }); }); }}>
            <option value="">-- Sans chantier --</option>
            {props.chantiers.map(function(c) { return <option key={c.id} value={String(c.id)}>{c.name} — {c.client}</option>; })}
          </Sel>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Inp label="Date" type="date" value={form.date} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { date: e.target.value }); }); }} />
            <Inp label="Validite (jours)" type="number" value={form.validite} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { validite: e.target.value }); }); }} />
          </div>
          <div style={{ marginBottom: 14 }}>
            <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: "#374151", marginBottom: 6 }}>Produits *</label>
            {lines.map(function(l, i) {
              var selProd = props.products.find(function(p) { return String(p.id) === String(l.productId); });
              var displayPrice = l.customPrice !== "" && l.customPrice !== undefined ? l.customPrice : (selProd ? selProd.price : "");
              return (
                <div key={i} style={{ marginBottom: 10 }}>
                  <div style={{ display: "flex", gap: 8, marginBottom: 4 }}>
                    <select value={l.productId} onChange={function(e) { var v = e.target.value; setLines(function(p) { return p.map(function(x, j) { return j === i ? Object.assign({}, x, { productId: v, customPrice: "" }) : x; }); }); }} style={Object.assign({}, IS, { flex: "2" })}>
                      <option value="">-- Produit --</option>
                      {props.products.map(function(p) { return <option key={p.id} value={p.id}>{p.name} — {fmtE(p.price)}/{p.unit}</option>; })}
                    </select>
                    <input type="number" min="1" value={l.qty} onChange={function(e) { var v = e.target.value; setLines(function(p) { return p.map(function(x, j) { return j === i ? Object.assign({}, x, { qty: v }) : x; }); }); }} style={Object.assign({}, IS, { width: 60 })} placeholder="Qte" />
                    <button onClick={function() { setLines(function(p) { return p.filter(function(_, j) { return j !== i; }); }); }} style={{ background: "#fef2f2", border: "none", color: "#ef4444", borderRadius: 8, cursor: "pointer", padding: "0 10px" }}>✕</button>
                  </div>
                  {l.productId && <div style={{ display: "flex", gap: 8, alignItems: "center", paddingLeft: 4 }}>
                    <label style={{ fontSize: 12, color: "#64748b", whiteSpace: "nowrap" }}>Prix unit. HT (€)</label>
                    <input type="number" min="0" step="0.01" value={displayPrice} placeholder={selProd ? String(selProd.price) : "0"} onChange={function(e) { var v = e.target.value; setLines(function(p) { return p.map(function(x, j) { return j === i ? Object.assign({}, x, { customPrice: v }) : x; }); }); }} style={Object.assign({}, IS, { width: 100, fontSize: 13 })} />
                    {selProd && <span style={{ fontSize: 11, color: "#94a3b8" }}>Catalogue: {fmtE(selProd.price)}</span>}
                  </div>}
                </div>
              );
            })}
            <div style={{ background: "#eff6ff", borderRadius: 8, padding: "8px 12px", marginBottom: 8 }}>
              <label style={{ fontSize: 12, fontWeight: 600, color: "#1e3a8a" }}>Marge commerciale globale (%)</label>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 4 }}>
                <input type="number" min="0" max="100" step="0.5" value={form.margin} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { margin: e.target.value }); }); }} style={Object.assign({}, IS, { width: 80 })} />
                <span style={{ fontSize: 12, color: "#64748b" }}>= +{fmtE(lines.reduce(function(s, l) { var p2 = props.products.find(function(x) { return String(x.id) === String(l.productId); }); var up = l.customPrice !== "" && l.customPrice !== undefined ? Number(l.customPrice) : (p2 ? p2.price : 0); return s + up * Number(l.qty || 0); }, 0) * Number(form.margin || 0) / 100)} de marge</span>
              </div>
            </div>
            <div style={{ textAlign: "right", fontWeight: 700, color: "#1e3a8a", margin: "6px 0" }}>
              Total HT : {fmtE(lines.reduce(function(s, l) { var p = props.products.find(function(x) { return String(x.id) === String(l.productId); }); var up = l.customPrice !== "" && l.customPrice !== undefined ? Number(l.customPrice) : (p ? p.price : 0); var fp = up * (1 + Number(form.margin || 0)/100); return s + fp * Number(l.qty || 0); }, 0))}
            </div>
            <Btn small outline onClick={function() { setLines(function(p) { return p.concat([{ productId: "", qty: 1, customPrice: "" }]); }); }}>+ Ajouter</Btn>
          </div>
          <Txta label="Notes" value={form.notes} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { notes: e.target.value }); }); }} />
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Btn outline onClick={function() { setModal(false); }}>Annuler</Btn><Btn onClick={submit}>Creer</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}


// ─── HISTORIQUE ───────────────────────────────────────────────────────────────

    }
    var logoSvg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 45' width='130' height='30'><text x='0' y='36' font-family='Georgia,serif' font-size='34' font-weight='bold' fill='#1e3a8a'>CAREMA</text></svg>";
    var html = "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Historique " + sec.label + "</title><style>" + css + "</style></head><body>"
      + "<div style='display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:12px;border-bottom:3px solid #1e3a8a'>"
      + "<div style='display:flex;align-items:center;gap:12px'>" + logoSvg + "<div style='border-left:2px solid #e2e8f0;padding-left:12px;font-size:11px;color:#64748b'>Villa Le Dome<br>4-6 rue des Lilas<br>98000 Monaco</div></div>"
      + "<div style='text-align:right'><div style='font-size:18px;font-weight:bold;color:#1e3a8a'>Historique</div><div style='font-size:13px;color:#64748b'>" + sec.label + " — " + new Date().toLocaleDateString("fr-FR") + "</div></div>"
      + "</div>"
      + "<h2>" + sec.icon + " " + sec.label + " (" + sec.data.length + " entree(s))</h2>"
      + rows
      + "<div class='footer'>CAREMA — Export historique — " + new Date().toLocaleString("fr-FR") + "</div>"
      + "</body></html>";
    setPrt(html);
  }

  if (prt) return <PrintModal html={prt} onClose={function() { setPrt(null); }} />;

  var activeData = secData[section].data;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h1 style={{ fontSize: 24, fontWeight: 800, color: "#1e293b", margin: 0 }}>Historique</h1>
        <Btn small onClick={exportPdf}>🖨️ Export PDF</Btn>
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16, overflowX: "auto", paddingBottom: 4 }}>
        {Object.entries(secData).filter(function(e) { return e[0] !== "devis" || canSeeDevis(props.user.role); }).map(function(e) {
          var key = e[0]; var sec = e[1];
          return (
            <button key={key} onClick={function() { setSection(key); }} style={{ padding: "8px 16px", borderRadius: 20, border: "none", cursor: "pointer", fontWeight: 600, fontSize: 13, whiteSpace: "nowrap", background: section === key ? "#1e3a8a" : "#f1f5f9", color: section === key ? "#fff" : "#64748b" }}>
              {sec.icon} {sec.label} ({sec.data.length})
            </button>
          );
        })}
      </div>

      {section === "commandes" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {activeData.map(function(o) {
            var ch = findCh(props.chantiers, o.chantierId);
            return (
              <div key={o.id} style={{ background: "#fff", borderRadius: 12, padding: "12px 16px", boxShadow: "0 2px 8px #00000010", borderLeft: "4px solid " + (SC[o.status] || "#94a3b8") }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}><span style={{ fontWeight: 700, fontSize: 14, color: "#1e3a8a" }}>{o.ref}</span><Badge status={o.status} /></div>
                <div style={{ fontSize: 13 }}>🏗️ {ch ? ch.name : "—"} · 👤 {o.createdBy || "—"}</div>
                <div style={{ fontSize: 12, color: "#64748b" }}>📅 {fmtD(o.date)} · {(o.products || []).length} produit(s){canSeePrices(props.user.role) ? " · " + fmtE(totalOf(o.products, props.products)) + " HT" : ""}</div>
              </div>
            );
          })}
          {activeData.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#94a3b8" }}><div style={{ fontSize: 40 }}>🛒</div><p>Aucune commande</p></div>}
        </div>
      )}

      {section === "livraisons" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {activeData.map(function(d) {
            var ch = findCh(props.chantiers, d.chantierId);
            return (
              <div key={d.id} style={{ background: "#fff", borderRadius: 12, padding: "12px 16px", boxShadow: "0 2px 8px #00000010", borderLeft: "4px solid " + (SC[d.status] || "#94a3b8") }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}><span style={{ fontWeight: 700, fontSize: 14, color: "#059669" }}>{d.bon}</span><Badge status={d.status} /></div>
                <div style={{ fontSize: 13 }}>🏗️ {ch ? ch.name : "—"} · 🚛 {d.createdBy || "—"}</div>
                <div style={{ fontSize: 12, color: "#64748b" }}>📅 {fmtD(d.date)}{d.heure ? " à " + d.heure : ""} · {(d.products || []).length} produit(s)</div>
                {d.confirmedBy && <div style={{ fontSize: 11, color: "#22c55e", marginTop: 2 }}>✅ {d.confirmedBy} · {d.confirmedAt}</div>}
              </div>
            );
          })}
          {activeData.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#94a3b8" }}><div style={{ fontSize: 40 }}>🚚</div><p>Aucune livraison</p></div>}
        </div>
      )}

      {section === "chantiers" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {activeData.map(function(c) {
            var nbOrd = (props.orders || []).filter(function(o) { return String(o.chantierId) === String(c.id); }).length;
            var nbLiv = (props.deliveries || []).filter(function(d) { return String(d.chantierId) === String(c.id); }).length;
            return (
              <div key={c.id} style={{ background: "#fff", borderRadius: 12, padding: "12px 16px", boxShadow: "0 2px 8px #00000010", borderLeft: "4px solid " + (SC[c.status] || "#94a3b8") }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}><span style={{ fontWeight: 700, fontSize: 14 }}>{c.name}</span><Badge status={c.status} /></div>
                <div style={{ fontSize: 13 }}>👤 {c.client || "—"} · 📍 {c.address || "—"}</div>
                <div style={{ fontSize: 12, color: "#64748b", marginTop: 4 }}>🛒 {nbOrd} commande(s) · 🚚 {nbLiv} livraison(s){canSeePrices(props.user.role) ? " · Budget: " + fmtE(c.budget) : ""}</div>
              </div>
            );
          })}
          {activeData.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#94a3b8" }}><div style={{ fontSize: 40 }}>🏗️</div><p>Aucun chantier</p></div>}
        </div>
      )}

      {section === "devis" && canSeeDevis(props.user.role) && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {activeData.map(function(d) {
            var ch = findCh(props.chantiers, d.chantierId);
            var tot = totalOf(d.products, props.products);
            return (
              <div key={d.id} style={{ background: "#fff", borderRadius: 12, padding: "12px 16px", boxShadow: "0 2px 8px #00000010", borderLeft: "4px solid " + (SC[d.status] || "#94a3b8") }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}><span style={{ fontWeight: 700, fontSize: 14, color: "#1e3a8a" }}>{d.ref}</span><Badge status={d.status} /></div>
                <div style={{ fontSize: 13 }}>👤 {d.client || "—"}{ch ? " · 🏗️ " + ch.name : ""}</div>
                <div style={{ fontSize: 12, color: "#64748b" }}>📅 {fmtD(d.date)} · {d.validite}j · {fmtE(tot)} HT · {fmtE(tot * 1.2)} TTC</div>
              </div>
            );
          })}
          {activeData.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#94a3b8" }}><div style={{ fontSize: 40 }}>📋</div><p>Aucun devis</p></div>}
        </div>
      )}
    </div>
  );
}

// ─── STOCK ───────────────────────────────────────────────────────────────────
function Stock(props) {
  var [modal, setModal] = useState(false);
  var [adj, setAdj] = useState({ productId: "", qty: 1, unite: "palette", type: "entree", notes: "" });
  var low = props.products.filter(function(p) { return p.stock <= p.minStock; });

  function doAdj() {
    if (!adj.productId || Number(adj.qty) <= 0) return;
    props.setProducts(function(p) {
      return p.map(function(x) {
        if (String(x.id) === String(adj.productId)) {
          var ns = adj.type === "entree" ? x.stock + Number(adj.qty) : Math.max(0, x.stock - Number(adj.qty));
          return Object.assign({}, x, { stock: ns });
        }
        return x;
      });
    });
    props.addNotif("success", "Stock ajuste manuellement", (adj.type === "entree" ? "+" : "-") + adj.qty + " " + adj.unite);
    setModal(false);
    setAdj({ productId: "", qty: 1, unite: "palette", type: "entree", notes: "" });
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <h1 style={{ fontSize: 24, fontWeight: 800, color: "#1e293b", margin: 0 }}>Stock entrepot</h1>
        {props.user.role === "admin" && <Btn onClick={function() { setModal(true); }}>Ajuster</Btn>}
      </div>
      <div style={{ background: "#f8fafc", border: "1px solid #e2e8f0", borderRadius: 10, padding: "8px 14px", marginBottom: 14, fontSize: 12, color: "#64748b" }}>
        Le stock augmente automatiquement quand une commande achat est marquee recue. Il diminue automatiquement quand une livraison chantier est confirmee.
      </div>
      {props.user.role !== "admin" && <div style={{ background: "#eff6ff", border: "1px solid #bfdbfe", borderRadius: 10, padding: "8px 14px", marginBottom: 14, fontSize: 12, color: "#1d4ed8" }}>Consultation uniquement — l administrateur peut ajuster manuellement si necessaire.</div>}
      {low.length > 0 && <div style={{ background: "#fef2f2", border: "1px solid #fecaca", borderRadius: 12, padding: "12px 14px", marginBottom: 14 }}><div style={{ fontWeight: 700, color: "#dc2626", fontSize: 13 }}>⚠️ {low.length} produit(s) en stock bas — pensez a passer une commande !</div>{low.map(function(p) { return <div key={p.id} style={{ fontSize: 12, color: "#dc2626", marginTop: 4 }}>{p.name} : {p.stock} {p.unit} (min: {p.minStock})</div>; })}</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {props.products.map(function(p) {
          var isLow = p.stock <= p.minStock;
          var pct = p.minStock > 0 ? Math.min(100, (p.stock / (p.minStock * 3)) * 100) : 100;
          return (
            <div key={p.id} style={{ background: "#fff", borderRadius: 14, padding: "14px 16px", boxShadow: "0 2px 8px #00000010", borderLeft: "4px solid " + (isLow ? "#ef4444" : "#22c55e") }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div><div style={{ fontWeight: 700, fontSize: 14 }}>{p.name}</div><div style={{ fontSize: 12, color: "#64748b" }}>{p.category} · min. {p.minStock} {p.unit}</div></div>
                <div style={{ textAlign: "right" }}><div style={{ fontWeight: 800, fontSize: 22, color: isLow ? "#ef4444" : "#22c55e" }}>{p.stock}</div><div style={{ fontSize: 11, color: "#94a3b8" }}>{p.unit}</div></div>
              </div>
              <div style={{ background: "#f1f5f9", borderRadius: 6, height: 6, overflow: "hidden" }}>
                <div style={{ height: "100%", width: pct + "%", background: isLow ? "#ef4444" : "#22c55e", borderRadius: 6, transition: "width 0.3s" }} />
              </div>
              {p.price && <div style={{ fontSize: 12, color: "#64748b", marginTop: 6 }}>Prix unitaire : {fmtE(p.price)}/{p.unit} · Valeur stock : {fmtE(p.stock * p.price)}</div>}
            </div>
          );
        })}
      </div>
      {modal && (
        <Modal title="Ajustement manuel stock" onClose={function() { setModal(false); }}>
          <div style={{ background: "#fffbeb", border: "1px solid #fde68a", borderRadius: 8, padding: "8px 12px", marginBottom: 14, fontSize: 12, color: "#92400e" }}>Ajustement manuel — en principe le stock se gere automatiquement via les commandes et livraisons.</div>
          <Sel label="Produit" value={adj.productId} onChange={function(e) { setAdj(function(p) { return Object.assign({}, p, { productId: e.target.value }); }); }}>
            <option value="">-- Choisir --</option>
            {props.products.map(function(p) { return <option key={p.id} value={p.id}>{p.name} (stock actuel: {p.stock} {p.unit})</option>; })}
          </Sel>
          <Sel label="Type d ajustement" value={adj.type} onChange={function(e) { setAdj(function(p) { return Object.assign({}, p, { type: e.target.value }); }); }}>
            <option value="entree">+ Entree (inventaire, correction +)</option>
            <option value="sortie">- Sortie (perte, casse, correction -)</option>
          </Sel>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Inp label="Quantite" type="number" min="1" value={adj.qty} onChange={function(e) { setAdj(function(p) { return Object.assign({}, p, { qty: e.target.value }); }); }} />
            <Sel label="Unite" value={adj.unite} onChange={function(e) { setAdj(function(p) { return Object.assign({}, p, { unite: e.target.value }); }); }}>
              {UNITS.map(function(u) { return <option key={u} value={u}>{u}</option>; })}
            </Sel>
          </div>
          <Txta label="Motif" value={adj.notes} placeholder="Raison de l ajustement..." onChange={function(e) { setAdj(function(p) { return Object.assign({}, p, { notes: e.target.value }); }); }} />
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Btn outline onClick={function() { setModal(false); }}>Annuler</Btn><Btn onClick={doAdj}>Enregistrer</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── PRODUITS ────────────────────────────────────────────────────────────────
function Produits(props) {
  var [modal, setModal] = useState(null);
  var [form, setForm] = useState({ name: "", category: "", unit: "palette", price: "", stock: "", minStock: "" });
  var [search, setSearch] = useState("");

  function save() {
    if (!form.name) return;
    if (modal === "new") {
      props.setProducts(function(p) { return p.concat([Object.assign({}, form, { id: uid(), price: Number(form.price), stock: Number(form.stock), minStock: Number(form.minStock) })]); });
      props.addNotif("success", "Produit ajoute", form.name);
    } else {
      props.setProducts(function(p) { return p.map(function(x) { return x.id === form.id ? Object.assign({}, form, { price: Number(form.price), stock: Number(form.stock), minStock: Number(form.minStock) }) : x; }); });
    }
    setModal(null);
  }

  var filtered = props.products.filter(function(p) { return p.name.toLowerCase().indexOf(search.toLowerCase()) >= 0 || (p.category || "").toLowerCase().indexOf(search.toLowerCase()) >= 0; });

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h1 style={{ fontSize: 24, fontWeight: 800, color: "#1e293b", margin: 0 }}>Catalogue produits</h1>
        <div style={{ display: "flex", gap: 8 }}>
          <Btn small outline onClick={function() { document.getElementById("xlsImport").click(); }}>📥 Import Excel/CSV</Btn>
          <Btn onClick={function() { setForm({ name: "", category: "", unit: "palette", price: "", stock: "", minStock: "" }); setModal("new"); }}>+ Nouveau</Btn>
        </div>
      </div>
      <input id="xlsImport" type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
          var text = ev.target.result;
          // Parse CSV
          var lines = text.split(/
?
/).filter(function(l) { return l.trim(); });
          if (lines.length < 2) { alert("Fichier vide ou format incorrect"); return; }
          // Detect separator
          var sep = lines[0].includes(";") ? ";" : ",";
          var headers = lines[0].split(sep).map(function(h) { return h.trim().toLowerCase().replace(/"/g,""); });
          var imported = 0;
          var skipped = 0;
          var newProds = [];
          for (var i = 1; i < lines.length; i++) {
            var cols = lines[i].split(sep).map(function(c) { return c.trim().replace(/"/g,""); });
            if (!cols[0]) continue;
            // Try to map columns (flexible: nom/name, categorie/category, unite/unit, prix/price, stock, min/minstock)
            var name = cols[headers.indexOf("nom")] || cols[headers.indexOf("name")] || cols[headers.indexOf("designation")] || cols[0] || "";
            var category = cols[headers.indexOf("categorie")] || cols[headers.indexOf("category")] || cols[1] || "";
            var unit = cols[headers.indexOf("unite")] || cols[headers.indexOf("unit")] || cols[2] || "unite";
            var price = parseFloat(cols[headers.indexOf("prix")] || cols[headers.indexOf("price")] || cols[3] || "0");
            var stock = parseFloat(cols[headers.indexOf("stock")] || cols[4] || "0");
            var minStock = parseFloat(cols[headers.indexOf("stock min")] || cols[headers.indexOf("minstock")] || cols[headers.indexOf("stock_min")] || cols[5] || "0");
            if (!name) { skipped++; continue; }
            newProds.push({ id: uid(), name: name, category: category, unit: unit, price: isNaN(price) ? 0 : price, stock: isNaN(stock) ? 0 : stock, minStock: isNaN(minStock) ? 0 : minStock });
            imported++;
          }
          if (newProds.length > 0) {
            props.setProducts(function(p) { return p.concat(newProds); });
            props.addNotif("success", imported + " produits importes !", skipped > 0 ? skipped + " lignes ignorees" : "");
          } else {
            alert("Aucun produit trouve. Verifiez que votre fichier a des colonnes: Nom, Categorie, Unite, Prix, Stock, Stock Min");
          }
          e.target.value = "";
        };
        // Read as text for CSV, or show help for xlsx
        if (file.name.endsWith(".csv")) {
          reader.readAsText(file, "UTF-8");
        } else {
          alert("Pour les fichiers Excel (.xlsx), veuillez d abord sauvegarder en CSV depuis Excel:
Fichier > Enregistrer sous > CSV (point-virgule).

Colonnes attendues: Nom | Categorie | Unite | Prix | Stock | Stock Min");
        }
      }} />
      <input placeholder="Rechercher un produit..." value={search} onChange={function(e) { setSearch(e.target.value); }} style={Object.assign({}, IS, { marginBottom: 16 })} />
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {filtered.map(function(p) {
          return (
            <div key={p.id} style={{ background: "#fff", borderRadius: 14, padding: "14px 16px", boxShadow: "0 2px 8px #00000010", border: "1px solid #e2e8f0" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{p.name}</div>
                  <div style={{ fontSize: 12, color: "#64748b" }}>{p.category} · {p.unit}</div>
                  <div style={{ display: "flex", gap: 16, marginTop: 6 }}>
                    {canSeePrices(props.user.role) && <span style={{ fontSize: 13, fontWeight: 700, color: "#1e3a8a" }}>{fmtE(p.price)}/{p.unit}</span>}
                    <span style={{ fontSize: 13, fontWeight: 700, color: p.stock <= p.minStock ? "#ef4444" : "#22c55e" }}>Stock: {p.stock}</span>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={function() { setForm(Object.assign({}, p, { price: String(p.price), stock: String(p.stock), minStock: String(p.minStock) })); setModal("edit"); }} style={{ background: "#f8fafc", border: "1px solid #e2e8f0", borderRadius: 8, cursor: "pointer", padding: "6px 10px" }}>✏️</button>
                  {props.user.role === "admin" && <button onClick={function() { if (confirm("Supprimer " + p.name + " ?")) { props.setProducts(function(px) { return px.filter(function(x) { return x.id !== p.id; }); }); } }} style={{ background: "#fef2f2", border: "1px solid #fecaca", borderRadius: 8, cursor: "pointer", padding: "6px 10px" }}>🗑️</button>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
      {modal && (
        <Modal title={modal === "new" ? "Nouveau produit" : "Modifier produit"} onClose={function() { setModal(null); }}>
          <Inp label="Nom *" value={form.name} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { name: e.target.value }); }); }} placeholder="Ex: Ciment Portland..." />
          <Inp label="Categorie" value={form.category} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { category: e.target.value }); }); }} placeholder="Gros oeuvre, Granulats..." />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Sel label="Unite" value={form.unit} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { unit: e.target.value }); }); }}>
              {UNITS.map(function(u) { return <option key={u} value={u}>{u}</option>; })}
            </Sel>
            <Inp label="Prix HT (EUR)" type="number" value={form.price} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { price: e.target.value }); }); }} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Inp label="Stock initial" type="number" value={form.stock} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { stock: e.target.value }); }); }} />
            <Inp label="Stock minimum" type="number" value={form.minStock} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { minStock: e.target.value }); }); }} />
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Btn outline onClick={function() { setModal(null); }}>Annuler</Btn><Btn onClick={save}>Enregistrer</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── UTILISATEURS ────────────────────────────────────────────────────────────
function Users(props) {
  var [modal, setModal] = useState(false);
  var [form, setForm] = useState({ name: "", email: "", password: "", role: "user" });

  function save() {
    if (!form.name || !form.email || !form.password) return;
    var initials = form.name.split(" ").map(function(n) { return n[0]; }).join("").toUpperCase().slice(0, 2);
    props.setUsers(function(p) { return p.concat([Object.assign({}, form, { id: uid(), avatar: initials })]); });
    props.addNotif("success", "Utilisateur cree", form.name);
    setModal(false);
    setForm({ name: "", email: "", password: "", role: "user" });
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h1 style={{ fontSize: 24, fontWeight: 800, color: "#1e293b", margin: 0 }}>Utilisateurs</h1>
        <Btn onClick={function() { setModal(true); }}>+ Nouveau</Btn>
      </div>
      <div style={{ background: "#f8fafc", border: "1px solid #e2e8f0", borderRadius: 10, padding: "8px 14px", marginBottom: 14, fontSize: 12, color: "#64748b" }}>
        Commandes achat : Admin, Chef, Utilisateur · Livraisons chantier : Admin, Chef · Confirmation livraison : Admin, Chef, Chauffeur
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {props.users.map(function(u) {
          var role = ROLES[u.role] || ROLES.user;
          return (
            <div key={u.id} style={{ background: "#fff", borderRadius: 14, padding: 16, boxShadow: "0 2px 10px #00000010" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
                <div style={{ width: 44, height: 44, borderRadius: "50%", background: role.color, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontWeight: 800, fontSize: 16, flexShrink: 0 }}>{u.avatar}</div>
                <div style={{ flex: 1 }}><div style={{ fontWeight: 700, fontSize: 14 }}>{u.name}</div><div style={{ fontSize: 12, color: "#64748b" }}>{u.email}</div></div>
                <button onClick={function() { if (confirm("Supprimer " + u.name + " ?")) props.setUsers(function(p) { return p.filter(function(x) { return x.id !== u.id; }); }); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#ef4444", fontSize: 18 }}>🗑️</button>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                {Object.entries(ROLES).map(function(entry) {
                  var key = entry[0]; var r = entry[1];
                  return (
                    <button key={key} onClick={function() { props.setUsers(function(p) { return p.map(function(x) { return x.id === u.id ? Object.assign({}, x, { role: key }) : x; }); }); }} style={{ padding: "7px 10px", borderRadius: 8, border: "2px solid " + (u.role === key ? r.color : "#e2e8f0"), background: u.role === key ? r.bg : "#f8fafc", color: u.role === key ? r.color : "#64748b", cursor: "pointer", fontWeight: u.role === key ? 700 : 500, fontSize: 12, display: "flex", alignItems: "center", gap: 5 }}>
                      {r.icon} {r.label}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
      {modal && (
        <Modal title="Nouvel utilisateur" onClose={function() { setModal(false); }}>
          <Inp label="Nom complet *" value={form.name} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { name: e.target.value }); }); }} placeholder="Jean Dupont" />
          <Inp label="Email *" type="email" value={form.email} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { email: e.target.value }); }); }} />
          <Inp label="Mot de passe *" type="password" value={form.password} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { password: e.target.value }); }); }} />
          <div style={{ marginBottom: 14 }}>
            <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: "#374151", marginBottom: 8 }}>Role</label>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
              {Object.entries(ROLES).map(function(entry) {
                var key = entry[0]; var r = entry[1];
                return (
                  <button key={key} onClick={function() { setForm(function(p) { return Object.assign({}, p, { role: key }); }); }} style={{ padding: "10px", borderRadius: 10, border: "2px solid " + (form.role === key ? r.color : "#e2e8f0"), background: form.role === key ? r.bg : "#f8fafc", color: form.role === key ? r.color : "#64748b", cursor: "pointer", fontWeight: form.role === key ? 700 : 500, fontSize: 13, display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 18 }}>{r.icon}</span> {r.label}
                  </button>
                );
              })}
            </div>
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Btn outline onClick={function() { setModal(false); }}>Annuler</Btn><Btn onClick={save}>Creer</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── LOGIN ───────────────────────────────────────────────────────────────────
function Login(props) {
  var [tab, setTab] = useState("login");
  var [form, setForm] = useState({ email: "", password: "", name: "", role: "user" });
  var [err, setErr] = useState("");

  function login() {
    var u = props.users.find(function(u) { return u.email === form.email && u.password === form.password; });
    if (u) { setErr(""); props.onLogin(u); }
    else setErr("Email ou mot de passe incorrect");
  }

  function register() {
    if (!form.name || !form.email || !form.password) { setErr("Remplissez tous les champs"); return; }
    if (props.users.find(function(u) { return u.email === form.email; })) { setErr("Email deja utilise"); return; }
    var initials = form.name.split(" ").map(function(n) { return n[0]; }).join("").toUpperCase().slice(0, 2);
    var u = { id: uid(), name: form.name, email: form.email, password: form.password, role: form.role, avatar: initials };
    props.setUsers(function(p) { return p.concat([u]); });
    props.onLogin(u);
  }

  return (
    <div style={{ minHeight: "100vh", background: "linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div style={{ background: "#fff", borderRadius: 20, padding: 28, width: "100%", maxWidth: 400, boxShadow: "0 20px 60px #00000050" }}>
        <div style={{ textAlign: "center", marginBottom: 24 }}>
          <div style={{ fontSize: 32, fontWeight: 900, color: "#1e3a8a", letterSpacing: 4, marginBottom: 4 }}>CAREMA</div>
          <div style={{ fontSize: 12, color: "#94a3b8" }}>Villa Le Dome · 4-6 rue des Lilas · 98000 Monaco</div>
          <div style={{ fontSize: 13, color: "#64748b", marginTop: 6, fontStyle: "italic" }}>Gestion des livraisons chantiers</div>
        </div>
        <div style={{ display: "flex", background: "#f1f5f9", borderRadius: 10, padding: 4, marginBottom: 20 }}>
          {["login", "register"].map(function(t) {
            return (
              <button key={t} onClick={function() { setTab(t); setErr(""); }} style={{ flex: 1, padding: "8px", borderRadius: 8, border: "none", cursor: "pointer", fontWeight: 600, fontSize: 13, background: tab === t ? "#fff" : "transparent", color: tab === t ? "#1e3a8a" : "#64748b", boxShadow: tab === t ? "0 2px 8px #00000015" : "none" }}>
                {t === "login" ? "Connexion" : "Inscription"}
              </button>
            );
          })}
        </div>
        {tab === "register" && (
          <div>
            <Inp label="Nom complet" value={form.name} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { name: e.target.value }); }); }} placeholder="Jean Dupont" />
            <div style={{ marginBottom: 14 }}>
              <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: "#374151", marginBottom: 6 }}>Mon role</label>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                {Object.entries(ROLES).filter(function(e) { return e[0] !== "admin"; }).map(function(entry) {
                  var key = entry[0]; var r = entry[1];
                  return (
                    <button key={key} onClick={function() { setForm(function(p) { return Object.assign({}, p, { role: key }); }); }} style={{ padding: "9px 8px", borderRadius: 10, border: "2px solid " + (form.role === key ? r.color : "#e2e8f0"), background: form.role === key ? r.bg : "#f8fafc", color: form.role === key ? r.color : "#64748b", cursor: "pointer", fontWeight: form.role === key ? 700 : 500, fontSize: 12, display: "flex", alignItems: "center", gap: 6 }}>
                      {r.icon} {r.label}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        )}
        <Inp label="Email" type="email" value={form.email} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { email: e.target.value }); }); }} placeholder="vous@exemple.com" />
        <Inp label="Mot de passe" type="password" value={form.password} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { password: e.target.value }); }); }} placeholder="••••••••" />
        {err && <div style={{ color: "#ef4444", fontSize: 13, margin: "-6px 0 12px", background: "#fef2f2", padding: "8px 12px", borderRadius: 8 }}>{err}</div>}
        <Btn onClick={tab === "login" ? login : register} style={{ width: "100%" }}>
          {tab === "login" ? "Se connecter" : "Creer mon compte"}
        </Btn>
        {tab === "login" && <p style={{ textAlign: "center", fontSize: 12, color: "#94a3b8", marginTop: 14 }}>Demo : admin@carema.mc / admin123</p>}
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  var [user, setUser] = useState(null);
  var [page, setPage] = useState("dashboard");
  var [menuOpen, setMenuOpen] = useState(false);
  var [users, setUsers] = useState(INIT_USERS);
  var [products, setProducts] = useState(INIT_PRODUCTS);
  var [chantiers, setChantiers] = useState(INIT_CHANTIERS);
  var [deliveries, setDeliveries] = useState(INIT_DELIVERIES);
  var [orders, setOrders] = useState(INIT_ORDERS);
  var [devis, setDevis] = useState(INIT_DEVIS);
  var [toasts, setToasts] = useState([]);
  var [unread, setUnread] = useState(0);

  function addNotif(type, title, msg) {
    var id = uid();
    setToasts(function(p) { return p.concat([{ id: id, type: type, title: title, msg: msg }]); });
    setTimeout(function() { setToasts(function(p) { return p.filter(function(t) { return t.id !== id; }); }); }, 5500);
  }

  function navigate(p) { setPage(p); if (p === "commandes") setUnread(0); }

  if (!user) return <Login users={users} setUsers={setUsers} onLogin={function(u) { setUser(u); setPage("dashboard"); }} />;

  var sharedProps = {
    chantiers: chantiers, setChantiers: setChantiers,
    deliveries: deliveries, setDeliveries: setDeliveries,
    orders: orders, setOrders: setOrders,
    devis: devis, setDevis: setDevis,
    products: products, setProducts: setProducts,
    users: users, setUsers: setUsers,
    user: user, addNotif: addNotif, setUnread: setUnread,
  };

  return (
    <div style={{ fontFamily: "'Segoe UI',system-ui,sans-serif", background: "#f8fafc", minHeight: "100vh" }}>
      <Sidebar page={page} setPage={navigate} user={user} notifCount={unread} onLogout={function() { setUser(null); }} open={menuOpen} onClose={function() { setMenuOpen(false); }} />
      <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
        <TopBar page={page} onMenuOpen={function() { setMenuOpen(true); }} notifCount={unread} />
        <div style={{ flex: 1, padding: "18px 14px 40px" }}>
          {page === "dashboard"  && <Dashboard {...sharedProps} setPage={navigate} />}
          {page === "chantiers"  && <Chantiers {...sharedProps} />}
          {page === "commandes"  && <Commandes {...sharedProps} />}
          {page === "livraisons" && <Livraisons {...sharedProps} />}
          {page === "devis" && canSeeDevis(user.role) && <Devis {...sharedProps} />}
          {page === "historique" && <Historique {...sharedProps} />}
          {page === "stock"      && <Stock {...sharedProps} />}
          {page === "produits"   && <Produits {...sharedProps} />}
          {page === "users" && user.role === "admin" && <Users {...sharedProps} />}
        </div>
      </div>
      <Toast items={toasts} onDismiss={function(id) { setToasts(function(p) { return p.filter(function(t) { return t.id !== id; }); }); }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
</body>
</html>
