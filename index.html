    #root { min-height: 100vh; }
    #splash { position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e3a8a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999; }
    #splash h1 { color:#fff;font-size:42px;font-weight:900;letter-spacing:4px;font-family:-apple-system,sans-serif; }
    #splash p { color:#93c5fd;font-size:14px;margin-top:8px; }
    #splash .bar { width:200px;height:4px;background:#ffffff20;border-radius:4px;margin-top:30px;overflow:hidden; }
    #splash .fill { height:100%;width:0%;background:#60a5fa;border-radius:4px;transition:width 0.3s; }
    #splash .errmsg { color:#fca5a5;font-size:12px;padding:16px;text-align:center;max-width:320px;margin-top:20px; }
    @keyframes slideIn { from { transform: translateX(120px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  </style>

  <h1>CAREMA</h1>
  <p id="splashMsg">Chargement en cours...</p>

  <div class="errmsg" id="errmsg" style="display:none"></div>
</div>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
var bar = document.getElementById("bar");
var pct = 0;
var iv = setInterval(function() { pct += 3; bar.style.width = Math.min(pct, 85) + "%"; if (pct >= 85) clearInterval(iv); }, 100);

window.addEventListener("load", function() {
  document.getElementById("splashMsg").textContent = "Compilation...";
  var s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js";
  s.onload = function() {
    bar.style.width = "90%";
    var code = document.getElementById("appcode").textContent;
    try {
      var out = Babel.transform(code, { presets: [["react", {}]] }).code;
      bar.style.width = "100%";
      setTimeout(function() {
        try {
          var fn = new Function("React", "ReactDOM", out + "\nreturn App;");
          var App = fn(React, ReactDOM);
          document.getElementById("splash").style.display = "none";
          ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
        } catch(e2) {
          document.getElementById("errmsg").style.display = "block";
          document.getElementById("errmsg").textContent = "Erreur runtime: " + e2.message;
        }
      }, 100);
    } catch(e) {
      document.getElementById("errmsg").style.display = "block";
      document.getElementById("errmsg").textContent = "Erreur: " + e.message.substring(0, 200);
    }
  };
  s.onerror = function() {
    document.getElementById("errmsg").style.display = "block";
    document.getElementById("errmsg").textContent = "Impossible de charger Babel. Verifiez votre connexion internet.";
  };
  document.head.appendChild(s);
});
if ("serviceWorker" in navigator) { window.addEventListener("load", function() { navigator.serviceWorker.register("./sw.js"); }); }
</script>

}

        <div style={{ width: 22, height: 2, background: "#1e3a8a", borderRadius: 2, marginBottom: 5 }} />

    </div>
  );
}

function Toast(props) {
  return (
    <div style={{ position: "fixed", top: 16, right: 16, zIndex: 3000, display: "flex", flexDirection: "column", gap: 8 }}>

          <div key={n.id} style={{ background: bg, color: "#fff", borderRadius: 12, padding: "12px 16px", minWidth: 260, maxWidth: 340, boxShadow: "0 4px 20px #00000030", display: "flex", gap: 10, alignItems: "flex-start" }}>

// ─── DASHBOARD ───────────────────────────────────────────────────────────────

// ─── CHANTIERS ───────────────────────────────────────────────────────────────
function Chantiers(props) {
  var [modal, setModal] = useState(null);
  var [sel, setSel] = useState(null);
  var [form, setForm] = useState({ name: "", address: "", client: "", status: "en_cours", budget: "", startDate: "", endDate: "" });
  function ff(k, v) { setForm(function(p) { return Object.assign({}, p, { [k]: v }); }); }

  function save() {
    if (!form.name || !form.client) return;
    if (modal === "new") {
      props.setChantiers(function(p) { return p.concat([Object.assign({}, form, { id: uid(), budget: Number(form.budget) || 0 })]); });
      props.addNotif("success", "Chantier cree", form.name);
    } else {
      props.setChantiers(function(p) { return p.map(function(c) { return c.id === form.id ? Object.assign({}, form, { budget: Number(form.budget) || 0 }) : c; }); });
    }
    setModal(null);
  }

  if (sel) {
    var c = props.chantiers.find(function(x) { return String(x.id) === String(sel); }) || {};
    var cDel = props.deliveries.filter(function(d) { return String(d.chantierId) === String(sel); });
    var cOrd = props.orders.filter(function(o) { return String(o.chantierId) === String(sel); });

    // Calcul dépenses : total commandes achat reçues
    var totalAchats = cOrd.filter(function(o) { return o.status === "recue"; }).reduce(function(s, o) { return s + totalOf(o.products, props.products); }, 0);
    // Calcul valeur livraisons confirmées
    var totalLivraisons = cDel.filter(function(d) { return d.status === "livre"; }).reduce(function(s, d) {
      return s + (d.products || []).reduce(function(ss, p) {
        var pr = props.products.find(function(x) { return String(x.id) === String(p.productId); });
        return ss + (pr ? pr.price * Number(p.qty) : 0);
      }, 0);
    }, 0);

    return (
      <div>
        <button onClick={function() { setSel(null); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#3b82f6", fontWeight: 600, fontSize: 14, marginBottom: 16, padding: 0 }}>← Retour</button>
        <div style={{ background: "linear-gradient(135deg,#1e3a8a,#3b82f6)", borderRadius: 16, padding: 20, color: "#fff", marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
            <div><div style={{ fontSize: 22, fontWeight: 800 }}>{c.name}</div><div style={{ opacity: 0.8, fontSize: 13, marginTop: 4 }}>{c.address}</div></div>
            <Badge status={c.status} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Client</div><div style={{ fontWeight: 700 }}>{c.client}</div></div>
            {canSeePrices(props.user.role) && <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Budget total</div><div style={{ fontWeight: 700 }}>{fmtE(c.budget)}</div></div>}
            {canSeePrices(props.user.role) && <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Achats recus</div><div style={{ fontWeight: 700 }}>{fmtE(totalAchats)}</div></div>}
            {canSeePrices(props.user.role) && <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Livraisons confirmees</div><div style={{ fontWeight: 700 }}>{fmtE(totalLivraisons)}</div></div>}
          </div>
          {c.budget > 0 && canSeePrices(props.user.role) && (
            <div style={{ marginTop: 12 }}>
              <div style={{ fontSize: 11, opacity: 0.7, marginBottom: 4 }}>Budget consomme (achats)</div>
              <div style={{ background: "#ffffff20", borderRadius: 6, height: 8, overflow: "hidden" }}>
                <div style={{ height: "100%", width: Math.min(100, (totalAchats / c.budget) * 100) + "%", background: totalAchats > c.budget ? "#ef4444" : "#4ade80", borderRadius: 6 }} />
              </div>
              <div style={{ fontSize: 11, opacity: 0.8, marginTop: 3 }}>{Math.round((totalAchats / c.budget) * 100)}% utilise</div>
            </div>
          )}
        </div>

        {/* Commandes achat pour ce chantier */}
        <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 12, boxShadow: "0 2px 10px #00000010" }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span>🛒 Commandes achat ({cOrd.length})</span>
            {canSeePrices(props.user.role) && <span style={{ fontSize: 13, color: "#64748b" }}>{fmtE(totalAchats)} reçu</span>}
          </div>
          {cOrd.length === 0 && <div style={{ fontSize: 13, color: "#94a3b8", textAlign: "center", padding: "10px 0" }}>Aucune commande</div>}
          {cOrd.map(function(o) {
            return (
              <div key={o.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid #f1f5f9" }}>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{o.ref}</div>
                  <div style={{ fontSize: 12, color: "#64748b" }}>📅 {fmtD(o.date)} · {o.createdBy}</div>
                  {(o.products || []).map(function(p, i) {
                    var pr = props.products.find(function(x) { return String(x.id) === String(p.productId); });
                    return pr ? <div key={i} style={{ fontSize: 12, color: "#374151", marginTop: 2 }}>• {pr.name} : {p.qty} {pr.unit}</div> : null;
                  })}
                </div>
                <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 10 }}>
                  <Badge status={o.status} />
                  {canSeePrices(props.user.role) && <div style={{ fontWeight: 700, fontSize: 13, color: "#1e3a8a", marginTop: 4 }}>{fmtE(totalOf(o.products, props.products))}</div>}
                </div>
              </div>
            );
          })}
        </div>

        {/* Livraisons pour ce chantier */}
        <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 12, boxShadow: "0 2px 10px #00000010" }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span>🚚 Livraisons chantier ({cDel.length})</span>
            {canSeePrices(props.user.role) && <span style={{ fontSize: 13, color: "#64748b" }}>{fmtE(totalLivraisons)} livré</span>}
          </div>
          {cDel.length === 0 && <div style={{ fontSize: 13, color: "#94a3b8", textAlign: "center", padding: "10px 0" }}>Aucune livraison</div>}
          {cDel.map(function(d) {
            return (
              <div key={d.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid #f1f5f9" }}>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{d.bon}</div>
                  <div style={{ fontSize: 12, color: "#64748b" }}>📅 {fmtD(d.date)}{d.heure ? " à " + d.heure : ""}</div>
                  {(d.products || []).map(function(p, i) {
                    var pr = props.products.find(function(x) { return String(x.id) === String(p.productId); });
                    return pr ? <div key={i} style={{ fontSize: 12, color: "#374151", marginTop: 2 }}>• {pr.name} : {p.qty} {p.unite || pr.unit}</div> : null;
                  })}
                  {d.confirmedBy && <div style={{ fontSize: 11, color: "#22c55e", marginTop: 2 }}>✅ Confirme par {d.confirmedBy}</div>}
                </div>
                <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 10 }}>
                  <Badge status={d.status} />
                </div>
              </div>
            );
          })}
        </div>

        <div style={{ display: "flex", gap: 10 }}>
          <Btn onClick={function() { setForm(Object.assign({}, c, { budget: String(c.budget || "") })); setModal("edit"); }} outline style={{ flex: 1 }}>✏️ Modifier</Btn>
          {props.user.role === "admin" && <Btn danger onClick={function() { if (confirm("Supprimer ?")) { props.setChantiers(function(p) { return p.filter(function(x) { return x.id !== c.id; }); }); setSel(null); } }} style={{ flex: 1 }}>🗑️ Supprimer</Btn>}
        </div>
        {modal === "edit" && (
          <Modal title="Modifier chantier" onClose={function() { setModal(null); }}>
            <Inp label="Nom *" value={form.name} onChange={function(e) { ff("name", e.target.value); }} />
            <Inp label="Adresse" value={form.address} onChange={function(e) { ff("address", e.target.value); }} />
            <Inp label="Client *" value={form.client} onChange={function(e) { ff("client", e.target.value); }} />
            <Sel label="Statut" value={form.status} onChange={function(e) { ff("status", e.target.value); }}>
              <option value="en_cours">En cours</option><option value="suspendu">Suspendu</option><option value="termine">Termine</option>
            </Sel>
            <Inp label="Budget (EUR)" type="number" value={form.budget} onChange={function(e) { ff("budget", e.target.value); }} />
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <Btn outline onClick={function() { setModal(null); }}>Annuler</Btn><Btn onClick={save}>Enregistrer</Btn>
            </div>
          </Modal>
        )}
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h1 style={{ fontSize: 24, fontWeight: 800, color: "#1e293b", margin: 0 }}>Chantiers</h1>
        <Btn onClick={function() { setForm({ name: "", address: "", client: "", status: "en_cours", budget: "", startDate: "", endDate: "" }); setModal("new"); }}>+ Nouveau</Btn>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {props.chantiers.map(function(c) {
          return (
            <div key={c.id} onClick={function() { setSel(c.id); }} style={{ background: "#fff", borderRadius: 14, padding: 16, boxShadow: "0 2px 10px #00000010", borderLeft: "4px solid " + (SC[c.status] || "#94a3b8"), cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}><div style={{ fontWeight: 700, fontSize: 15 }}>{c.name}</div><Badge status={c.status} /></div>
              <div style={{ fontSize: 13, color: "#64748b" }}>👤 {c.client}</div>
              <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 4 }}>📍 {c.address}</div>
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, paddingTop: 10, borderTop: "1px solid #f1f5f9" }}>
                <span style={{ fontSize: 13, color: "#3b82f6", fontWeight: 600 }}>{fmtE(c.budget)}</span>
                <span style={{ fontSize: 12, color: "#3b82f6" }}>Voir details →</span>
              </div>
            </div>
          );
        })}
        {props.chantiers.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#94a3b8" }}><div style={{ fontSize: 48 }}>🏗️</div><p>Aucun chantier</p></div>}
      </div>
      {modal === "new" && (
        <Modal title="Nouveau chantier" onClose={function() { setModal(null); }}>
          <Inp label="Nom *" value={form.name} onChange={function(e) { ff("name", e.target.value); }} />
          <Inp label="Adresse" value={form.address} onChange={function(e) { ff("address", e.target.value); }} />
          <Inp label="Client *" value={form.client} onChange={function(e) { ff("client", e.target.value); }} />
          <Sel label="Statut" value={form.status} onChange={function(e) { ff("status", e.target.value); }}>
            <option value="en_cours">En cours</option><option value="suspendu">Suspendu</option><option value="termine">Termine</option>
          </Sel>
          <Inp label="Budget (EUR)" type="number" value={form.budget} onChange={function(e) { ff("budget", e.target.value); }} />
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Btn outline onClick={function() { setModal(null); }}>Annuler</Btn><Btn onClick={save}>Creer</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── COMMANDES ACHAT (bons d'achat fournisseur) ──────────────────────────────
function Commandes(props) {
  var [modal, setModal] = useState(false);
  var [sel, setSel] = useState(null);
  var [prt, setPrt] = useState(null);
  var [lines, setLines] = useState([{ productId: "", qty: 1 }]);
  var [form, setForm] = useState({ chantierId: "", date: new Date().toISOString().split("T")[0], notes: "", fournisseur: "" });
  var [filter, setFilter] = useState("all");
  var canCreate = canCreateOrder(props.user.role);

  function submit() {
    if (!form.chantierId || lines.some(function(l) { return !l.productId; })) return;
    var ref = gRef("BC", props.orders);
    var o = { id: uid(), chantierId: form.chantierId, date: form.date, notes: form.notes, fournisseur: form.fournisseur, products: lines.map(function(l) { return { productId: String(l.productId), qty: Number(l.qty) }; }), status: "en_attente", ref: ref, createdBy: props.user.name };
    props.setOrders(function(p) { return p.concat([o]); });
    props.addNotif("warn", "Nouvelle commande achat", ref + " par " + props.user.name);
    props.setUnread(function(n) { return n + 1; });
    setModal(false);
    setLines([{ productId: "", qty: 1 }]);
    setForm({ chantierId: "", date: new Date().toISOString().split("T")[0], notes: "", fournisseur: "" });
  }

  // Quand commande recue → stock augmente automatiquement
  function marquerRecue(o) {
    props.setProducts(function(plist) {
      return plist.map(function(pr) {
        var line = (o.products || []).find(function(l) { return String(l.productId) === String(pr.id); });
        return line ? Object.assign({}, pr, { stock: pr.stock + Number(line.qty) }) : pr;
      });
    });
    props.setOrders(function(p) { return p.map(function(x) { return x.id === o.id ? Object.assign({}, x, { status: "recue", receivedAt: new Date().toLocaleString("fr-FR"), receivedBy: props.user.name }) : x; }); });
    setSel(function(p) { return p ? Object.assign({}, p, { status: "recue", receivedAt: new Date().toLocaleString("fr-FR"), receivedBy: props.user.name }) : null; });
    props.addNotif("success", "Marchandises recues !", "Stock mis a jour automatiquement pour " + o.ref);
  }

  function upSt(id, status) {
    props.setOrders(function(p) { return p.map(function(x) { return x.id === id ? Object.assign({}, x, { status: status }) : x; }); });
    setSel(function(p) { return p ? Object.assign({}, p, { status: status }) : null; });
  }

  var sorted = props.orders.slice().sort(function(a, b) { return b.id - a.id; });
  var filtered = sorted.filter(function(o) { return filter === "all" || o.status === filter; });

  if (prt) return <PrintModal html={prt} onClose={function() { setPrt(null); }} />;

  if (sel) {
    var o = props.orders.find(function(x) { return x.id === sel.id; }) || sel;
    var ch = findCh(props.chantiers, o.chantierId);
    var total = totalOf(o.products, props.products);
    return (
      <div>
        <button onClick={function() { setSel(null); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#3b82f6", fontWeight: 600, fontSize: 14, marginBottom: 16, padding: 0 }}>← Retour</button>
        <div style={{ background: "linear-gradient(135deg,#1e3a8a,#3b82f6)", borderRadius: 16, padding: 20, color: "#fff", marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
            <div><div style={{ fontSize: 11, opacity: 0.8 }}>Bon de commande achat</div><div style={{ fontSize: 22, fontWeight: 800 }}>{o.ref}</div></div>
            <Badge status={o.status} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Chantier concerne</div><div style={{ fontWeight: 700 }}>{ch ? ch.name : "—"}</div></div>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Client</div><div style={{ fontWeight: 700 }}>{ch ? ch.client : "—"}</div></div>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Date commande</div><div style={{ fontWeight: 700 }}>{fmtD(o.date)}</div></div>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Demande par</div><div style={{ fontWeight: 700 }}>{o.createdBy || "—"}</div></div>
          </div>
          {o.fournisseur && <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px", marginTop: 10 }}><div style={{ fontSize: 11, opacity: 0.7 }}>Fournisseur</div><div style={{ fontWeight: 700 }}>{o.fournisseur}</div></div>}
        </div>

        <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 12, boxShadow: "0 2px 10px #00000010" }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 12 }}>Materiaux commandes</div>
          {(o.products || []).map(function(p, i) {
            var pr = props.products.find(function(x) { return String(x.id) === String(p.productId); });
            return (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid #f1f5f9" }}>
                <div><div style={{ fontWeight: 600, fontSize: 13 }}>{pr ? pr.name : "Produit #" + p.productId}</div><div style={{ fontSize: 12, color: "#64748b" }}>{pr ? pr.unit : ""}</div></div>
                <div style={{ textAlign: "right" }}><div style={{ fontSize: 13 }}>{p.qty}{pr ? " x " + fmtE(pr.price) : ""}</div><div style={{ fontWeight: 700, color: "#1e3a8a" }}>{pr ? fmtE(pr.price * Number(p.qty)) : "0,00 EUR"}</div></div>
              </div>
            );
          })}
          {canSeePrices(props.user.role) && <div style={{ display: "flex", justifyContent: "space-between", marginTop: 12, paddingTop: 12, borderTop: "2px solid #e2e8f0" }}>
            <span style={{ fontWeight: 800, fontSize: 15 }}>Total HT</span>
            <span style={{ fontWeight: 800, fontSize: 18, color: "#1e3a8a" }}>{fmtE(total)}</span>
          </div>}
          {o.notes && <div style={{ marginTop: 10, padding: "8px 12px", background: "#f8fafc", borderRadius: 8, fontSize: 12, color: "#64748b" }}>📝 {o.notes}</div>}
        </div>

        {o.status === "recue" && <div style={{ background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: 12, padding: "10px 14px", marginBottom: 12, fontSize: 13 }}>✅ Recue le {o.receivedAt} par {o.receivedBy} — Stock mis a jour</div>}

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 12 }}>
          {props.user.role === "admin" && o.status === "en_attente" && (
            <div>
              <button onClick={function() { upSt(o.id, "validee"); props.addNotif("success", "Commande validee", o.ref); }} style={{ width: "100%", padding: 14, borderRadius: 12, border: "none", cursor: "pointer", background: "#3b82f6", color: "#fff", fontWeight: 700, fontSize: 15, marginBottom: 8 }}>✅ Valider la commande</button>
              <button onClick={function() { upSt(o.id, "annulee"); setSel(null); }} style={{ width: "100%", padding: 12, borderRadius: 12, border: "2px solid #ef4444", cursor: "pointer", background: "#fff", color: "#ef4444", fontWeight: 600 }}>❌ Annuler</button>
            </div>
          )}
          {props.user.role === "admin" && o.status === "validee" && (
            <button onClick={function() { marquerRecue(o); }} style={{ width: "100%", padding: 14, borderRadius: 12, border: "none", cursor: "pointer", background: "#22c55e", color: "#fff", fontWeight: 700, fontSize: 15 }}>📦 Marquer comme recue (stock +)</button>
          )}
        </div>

        <button onClick={function() {
          var ch2 = findCh(props.chantiers, o.chantierId);
          var rows = buildRows(o.products, props.products);
          var tot2 = totalOf(o.products, props.products);
          var info = "<div class='info'><strong>Chantier :</strong> " + (ch2 ? ch2.name : "-") + "<br><strong>Client :</strong> " + (ch2 ? ch2.client : "-") + "<br><strong>Demande par :</strong> " + (o.createdBy || "-") + (o.fournisseur ? "<br><strong>Fournisseur :</strong> " + o.fournisseur : "") + (o.notes ? "<br><strong>Notes :</strong> " + o.notes : "") + "</div>";
          var totals = "<div class='total'><div>Total HT : " + fmtE(tot2) + "</div></div>";
          setPrt(buildDocHtml(o.ref, "Bon de commande achat - " + fmtD(o.date), info, rows, totals));
        }} style={{ width: "100%", padding: 12, borderRadius: 12, border: "2px solid #1e3a8a", background: "#fff", color: "#1e3a8a", fontWeight: 600, cursor: "pointer" }}>🖨️ Apercu et Imprimer</button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <h1 style={{ fontSize: 24, fontWeight: 800, color: "#1e293b", margin: 0 }}>Commandes achat</h1>
        {canCreate && <Btn onClick={function() { setModal(true); }}>+ Nouvelle</Btn>}
      </div>
      <div style={{ background: "#fffbeb", border: "1px solid #fde68a", borderRadius: 10, padding: "8px 14px", marginBottom: 14, fontSize: 12, color: "#92400e" }}>
        🛒 Ces commandes sont les besoins en materiaux a acheter aupres des fournisseurs. Quand la commande est recue, le stock augmente automatiquement.
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16, overflowX: "auto", paddingBottom: 4 }}>
        {[["all","Toutes"],["en_attente","En attente"],["validee","Validees"],["recue","Recues"],["annulee","Annulees"]].map(function(arr) {
          return <button key={arr[0]} onClick={function() { setFilter(arr[0]); }} style={{ padding: "6px 14px", borderRadius: 20, border: "none", cursor: "pointer", fontWeight: 600, fontSize: 12, whiteSpace: "nowrap", background: filter === arr[0] ? "#1e3a8a" : "#f1f5f9", color: filter === arr[0] ? "#fff" : "#64748b" }}>{arr[1]}</button>;
        })}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {filtered.map(function(o) {
          var ch = findCh(props.chantiers, o.chantierId);
          var tot = totalOf(o.products, props.products);
          var sc = SC[o.status] || "#94a3b8";
          return (
            <div key={o.id} onClick={function() { setSel(o); }} style={{ background: "#fff", borderRadius: 14, padding: 16, boxShadow: "0 2px 10px #00000010", borderLeft: "4px solid " + sc, cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}><div style={{ fontWeight: 800, fontSize: 15, color: "#1e3a8a" }}>{o.ref}</div><Badge status={o.status} /></div>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#374151" }}>🏗️ {ch ? ch.name : "—"}</div>
              <div style={{ fontSize: 12, color: "#64748b", marginBottom: 8 }}>👤 Demande par {o.createdBy || "—"} · 📅 {fmtD(o.date)}</div>
              {o.fournisseur && <div style={{ fontSize: 12, color: "#64748b", marginBottom: 6 }}>🏪 {o.fournisseur}</div>}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid #f1f5f9", paddingTop: 8 }}>
                <span style={{ fontSize: 12, color: "#64748b" }}>{(o.products || []).length} produit(s)</span>
                {canSeePrices(props.user.role) && <span style={{ fontWeight: 800, color: "#1e3a8a" }}>{fmtE(tot)} HT</span>}
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#94a3b8" }}><div style={{ fontSize: 48 }}>🛒</div><p>Aucune commande</p></div>}
      </div>

      {modal && (
        <Modal title="Nouvelle commande achat" onClose={function() { setModal(false); }}>
          <div style={{ background: "#fffbeb", border: "1px solid #fde68a", borderRadius: 8, padding: "8px 12px", marginBottom: 14, fontSize: 12, color: "#92400e" }}>Commande de materiaux aupres d un fournisseur. Quand recue, le stock augmente.</div>
          <Sel label="Chantier concerne *" value={form.chantierId} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { chantierId: e.target.value }); }); }}>
            <option value="">-- Choisir le chantier --</option>
            {props.chantiers.map(function(c) { return <option key={c.id} value={String(c.id)}>{c.name} — {c.client}</option>; })}
          </Sel>
          <Inp label="Fournisseur" value={form.fournisseur} placeholder="Nom du fournisseur" onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { fournisseur: e.target.value }); }); }} />
          <Inp label="Date" type="date" value={form.date} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { date: e.target.value }); }); }} />
          <div style={{ marginBottom: 14 }}>
            <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: "#374151", marginBottom: 6 }}>Materiaux a commander *</label>
            {lines.map(function(l, i) {
              return (
                <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "center" }}>
                  <ProductSearch
                    products={props.products}
                    value={l.productId}
                    onChange={function(v) { setLines(function(p) { return p.map(function(x, j) { return j === i ? Object.assign({}, x, { productId: v }) : x; }); }); }}
                    placeholder="Rechercher..."
                  />
                  <input type="number" min="1" value={l.qty} onChange={function(e) { var v = e.target.value; setLines(function(p) { return p.map(function(x, j) { return j === i ? Object.assign({}, x, { qty: v }) : x; }); }); }} style={Object.assign({}, IS, { width: 70 })} />
                  <button onClick={function() { setLines(function(p) { return p.filter(function(_, j) { return j !== i; }); }); }} style={{ background: "#fef2f2", border: "none", color: "#ef4444", borderRadius: 8, cursor: "pointer", padding: "0 10px" }}>✕</button>
                </div>
              );
            })}
            <div style={{ textAlign: "right", fontWeight: 700, color: "#1e3a8a", margin: "6px 0" }}>
              Total HT : {fmtE(lines.reduce(function(s, l) { var p = props.products.find(function(x) { return String(x.id) === String(l.productId); }); return s + (p ? p.price * Number(l.qty) : 0); }, 0))}
            </div>
            <Btn small outline onClick={function() { setLines(function(p) { return p.concat([{ productId: "", qty: 1 }]); }); }}>+ Ajouter</Btn>
          </div>
          <Txta label="Notes / justification" value={form.notes} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { notes: e.target.value }); }); }} />
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Btn outline onClick={function() { setModal(false); }}>Annuler</Btn>
            <Btn onClick={submit}>Envoyer la demande</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── LIVRAISONS (bons de livraison entrepôt → chantier) ──────────────────────
function Livraisons(props) {
  var [modal, setModal] = useState(false);
  var [sel, setSel] = useState(null);
  var [editM, setEditM] = useState(false);
  var [editF, setEditF] = useState(null);
  var [editL, setEditL] = useState([]);
  var [lines, setLines] = useState([{ productId: "", qty: 1, unite: "palette" }]);
  var [form, setForm] = useState({ chantierId: "", date: new Date().toISOString().split("T")[0], heure: "", notes: "" });
  var [filt, setFilt] = useState("all");
  var canCreate = canCreateDelivery(props.user.role);

  function submit() {
    if (!form.chantierId || lines.some(function(l) { return !l.productId; })) return;
    var bon = gRef("BL", props.deliveries);
    var d = { id: uid(), chantierId: form.chantierId, date: form.date, heure: form.heure, notes: form.notes, status: "en_attente", products: lines.map(function(l) { return { productId: String(l.productId), qty: Number(l.qty), unite: l.unite }; }), bon: bon, createdBy: props.user.name };
    props.setDeliveries(function(p) { return p.concat([d]); });
    props.addNotif("success", "Bon de livraison cree", bon);
    setModal(false);
    setLines([{ productId: "", qty: 1, unite: "palette" }]);
    setForm({ chantierId: "", date: new Date().toISOString().split("T")[0], heure: "", notes: "" });
  }

  // Quand livraison confirmee → stock diminue automatiquement
  function confirmerLivraison(d) {
    props.setProducts(function(plist) {
      return plist.map(function(pr) {
        var line = (d.products || []).find(function(l) { return String(l.productId) === String(pr.id); });
        return line ? Object.assign({}, pr, { stock: Math.max(0, pr.stock - Number(line.qty)) }) : pr;
      });
    });
    props.setDeliveries(function(p) { return p.map(function(x) { return x.id === d.id ? Object.assign({}, x, { status: "livre", confirmedBy: props.user.name, confirmedAt: new Date().toLocaleString("fr-FR") }) : x; }); });
    setSel(function(p) { return p ? Object.assign({}, p, { status: "livre", confirmedBy: props.user.name, confirmedAt: new Date().toLocaleString("fr-FR") }) : null; });
    props.addNotif("success", "Livraison confirmee !", "Stock mis a jour automatiquement pour " + d.bon);
  }

  function upSt(id, status) {
    props.setDeliveries(function(p) { return p.map(function(d) { return d.id === id ? Object.assign({}, d, { status: status }) : d; }); });
    setSel(function(p) { return p ? Object.assign({}, p, { status: status }) : null; });
  }

  var sorted = props.deliveries.slice().sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
  var filtered = filt === "all" ? sorted : sorted.filter(function(d) { return d.status === filt; });

  if (sel) {
    var d = props.deliveries.find(function(x) { return x.id === sel.id; }) || sel;
    var ch = findCh(props.chantiers, d.chantierId);
    return (
      <div>
        <button onClick={function() { setSel(null); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#3b82f6", fontWeight: 600, fontSize: 14, marginBottom: 16, padding: 0 }}>← Retour</button>
        <div style={{ background: "linear-gradient(135deg,#059669,#10b981)", borderRadius: 16, padding: 20, color: "#fff", marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
            <div><div style={{ fontSize: 11, opacity: 0.8 }}>Bon de livraison chantier</div><div style={{ fontSize: 22, fontWeight: 800 }}>{d.bon}</div></div>
            <Badge status={d.status} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Chantier destinataire</div><div style={{ fontWeight: 700 }}>{ch ? ch.name : "—"}</div></div>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Client</div><div style={{ fontWeight: 700 }}>{ch ? ch.client : "—"}</div></div>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Date livraison</div><div style={{ fontWeight: 700 }}>{fmtD(d.date)}{d.heure ? " a " + d.heure : ""}</div></div>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Prepare par</div><div style={{ fontWeight: 700 }}>{d.createdBy || "—"}</div></div>
          </div>
        </div>

        <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 12, boxShadow: "0 2px 10px #00000010" }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 12 }}>Materiaux livres</div>
          {(d.products || []).length === 0 && <div style={{ fontSize: 13, color: "#94a3b8", textAlign: "center", padding: "10px 0" }}>Aucun produit enregistre</div>}
          {(d.products || []).map(function(p, i) {
            var pid = String(p.productId);
            var pr = props.products.find(function(x) { return String(x.id) === pid; });
            return (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid #f1f5f9" }}>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{pr ? pr.name : "Produit #" + pid}</div>
                  {pr && <div style={{ fontSize: 12, color: "#64748b" }}>{pr.category}</div>}
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontWeight: 700, color: "#059669", fontSize: 15 }}>{p.qty} {p.unite || (pr ? pr.unit : "")}</div>
                  {pr && <div style={{ fontSize: 12, color: "#64748b" }}>{fmtE(pr.price * Number(p.qty))}</div>}
                </div>
              </div>
            );
          })}
          {(d.products || []).length > 0 && (
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 12, paddingTop: 10, borderTop: "2px solid #e2e8f0" }}>
              <span style={{ fontWeight: 700, fontSize: 14 }}>Valeur totale</span>
              <span style={{ fontWeight: 800, fontSize: 16, color: "#059669" }}>
                {fmtE((d.products || []).reduce(function(s, p) {
                  var pr = props.products.find(function(x) { return String(x.id) === String(p.productId); });
                  return s + (pr ? pr.price * Number(p.qty) : 0);
                }, 0))}
              </span>
            </div>
          )}
          {d.notes && <div style={{ marginTop: 10, padding: "8px 12px", background: "#f8fafc", borderRadius: 8, fontSize: 12, color: "#64748b" }}>📝 {d.notes}</div>}
        </div>

        {d.confirmedBy && <div style={{ background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: 12, padding: "10px 14px", marginBottom: 12, fontSize: 13 }}>✅ Confirme par <strong>{d.confirmedBy}</strong> le {d.confirmedAt} — Stock diminue automatiquement</div>}

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 12 }}>
          {d.status === "en_attente" && props.user.role === "admin" && (
            <button onClick={function() { upSt(d.id, "en_route"); props.addNotif("success", "Chauffeur en route", d.bon); }} style={{ width: "100%", padding: 14, borderRadius: 12, border: "none", cursor: "pointer", background: "#8b5cf6", color: "#fff", fontWeight: 700, fontSize: 15 }}>🚚 Marquer en route</button>
          )}
          {(d.status === "en_attente" || d.status === "en_route") && (props.user.role === "chauffeur" || props.user.role === "chef_chantier" || props.user.role === "admin") && (
            <button onClick={function() { confirmerLivraison(d); }} style={{ width: "100%", padding: 14, borderRadius: 12, border: "none", cursor: "pointer", background: "#22c55e", color: "#fff", fontWeight: 700, fontSize: 15 }}>✅ Confirmer livraison au chantier (stock -)</button>
          )}
          {d.status === "en_attente" && props.user.role === "admin" && (
            <button onClick={function() { upSt(d.id, "annule"); setSel(null); }} style={{ width: "100%", padding: 12, borderRadius: 12, border: "2px solid #ef4444", cursor: "pointer", background: "#fff", color: "#ef4444", fontWeight: 600 }}>❌ Annuler</button>
          )}
          {(d.status === "en_attente") && canCreate && (
            <button onClick={function() { setEditF(Object.assign({}, d)); setEditL((d.products || []).map(function(p) { return { productId: String(p.productId), qty: p.qty, unite: p.unite || "palette" }; })); setEditM(true); }} style={{ width: "100%", padding: 12, borderRadius: 12, border: "2px solid #1e3a8a", cursor: "pointer", background: "#fff", color: "#1e3a8a", fontWeight: 600 }}>✏️ Modifier</button>
          )}
          {props.user.role === "admin" && <button onClick={function() { if (confirm("Supprimer ?")) { props.setDeliveries(function(p) { return p.filter(function(x) { return x.id !== d.id; }); }); setSel(null); } }} style={{ width: "100%", padding: 10, borderRadius: 12, border: "none", cursor: "pointer", background: "#fef2f2", color: "#ef4444", fontWeight: 600 }}>🗑️ Supprimer</button>}
        </div>

        {editM && editF && (
          <Modal title={"Modifier " + editF.bon} onClose={function() { setEditM(false); }}>
            <Sel label="Chantier" value={editF.chantierId} onChange={function(e) { setEditF(function(p) { return Object.assign({}, p, { chantierId: e.target.value }); }); }}>
              <option value="">-- Choisir --</option>
              {props.chantiers.map(function(c) { return <option key={c.id} value={String(c.id)}>{c.name}</option>; })}
            </Sel>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <Inp label="Date" type="date" value={editF.date} onChange={function(e) { setEditF(function(p) { return Object.assign({}, p, { date: e.target.value }); }); }} />
              <Inp label="Heure" type="time" value={editF.heure || ""} onChange={function(e) { setEditF(function(p) { return Object.assign({}, p, { heure: e.target.value }); }); }} />
            </div>
            <Txta label="Notes" value={editF.notes || ""} onChange={function(e) { setEditF(function(p) { return Object.assign({}, p, { notes: e.target.value }); }); }} />
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <Btn outline onClick={function() { setEditM(false); }}>Annuler</Btn>
              <Btn onClick={function() {
                var updated = Object.assign({}, editF, { products: editL.map(function(l) { return { productId: String(l.productId), qty: Number(l.qty), unite: l.unite }; }) });
                props.setDeliveries(function(p) { return p.map(function(x) { return x.id === updated.id ? updated : x; }); });
                setSel(updated);
                setEditM(false);
                props.addNotif("success", "Livraison modifiee", updated.bon);
              }}>Enregistrer</Btn>
            </div>
          </Modal>
        )}
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <h1 style={{ fontSize: 24, fontWeight: 800, color: "#1e293b", margin: 0 }}>Livraisons chantier</h1>
        {canCreate && <Btn onClick={function() { setModal(true); }}>+ Nouvelle</Btn>}
      </div>
      <div style={{ background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: 10, padding: "8px 14px", marginBottom: 14, fontSize: 12, color: "#166534" }}>
        🚚 Livraisons de materiaux depuis l entrepot vers le chantier. Quand confirmee, le stock diminue automatiquement.
      </div>
      {!canCreate && <div style={{ background: "#eff6ff", border: "1px solid #bfdbfe", borderRadius: 10, padding: "8px 14px", marginBottom: 14, fontSize: 12, color: "#1d4ed8" }}>Vous pouvez confirmer les livraisons mais seuls Admin et Chef de chantier peuvent en creer.</div>}
      <div style={{ display: "flex", gap: 8, marginBottom: 16, overflowX: "auto", paddingBottom: 4 }}>
        {[["all","Toutes"],["en_attente","En attente"],["en_route","En route"],["livre","Livrees"],["annule","Annulees"]].map(function(arr) {
          return <button key={arr[0]} onClick={function() { setFilt(arr[0]); }} style={{ padding: "6px 14px", borderRadius: 20, border: "none", cursor: "pointer", fontWeight: 600, fontSize: 12, whiteSpace: "nowrap", background: filt === arr[0] ? "#059669" : "#f1f5f9", color: filt === arr[0] ? "#fff" : "#64748b" }}>{arr[1]}</button>;
        })}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {filtered.map(function(d) {
          var ch = findCh(props.chantiers, d.chantierId);
          var sc = SC[d.status] || "#94a3b8";
          return (
            <div key={d.id} onClick={function() { setSel(d); }} style={{ background: "#fff", borderRadius: 14, padding: 16, boxShadow: "0 2px 10px #00000010", borderLeft: "4px solid " + sc, cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}><div style={{ fontWeight: 800, fontSize: 15, color: "#059669" }}>{d.bon}</div><Badge status={d.status} /></div>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#374151" }}>🏗️ {ch ? ch.name : "—"}</div>
              <div style={{ fontSize: 12, color: "#64748b", marginBottom: 6 }}>👤 {ch ? ch.client : "—"} · 📅 {fmtD(d.date)}{d.heure ? " a " + d.heure : ""}</div>
              <div style={{ fontSize: 12, color: "#94a3b8" }}>{(d.products || []).length} produit(s) · Prepare par {d.createdBy || "—"}</div>
            </div>
          );
        })}
        {filtered.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#94a3b8" }}><div style={{ fontSize: 48 }}>🚚</div><p>Aucune livraison</p></div>}
      </div>

      {modal && (
        <Modal title="Nouveau bon de livraison" onClose={function() { setModal(false); }}>
          <div style={{ background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: 8, padding: "8px 12px", marginBottom: 14, fontSize: 12, color: "#166534" }}>Envoi de materiaux de l entrepot vers le chantier. La confirmation diminuera le stock.</div>
          <Sel label="Chantier destinataire *" value={form.chantierId} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { chantierId: e.target.value }); }); }}>
            <option value="">-- Choisir --</option>
            {props.chantiers.map(function(c) { return <option key={c.id} value={String(c.id)}>{c.name} — {c.client}</option>; })}
          </Sel>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Inp label="Date" type="date" value={form.date} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { date: e.target.value }); }); }} />
            <Inp label="Heure" type="time" value={form.heure} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { heure: e.target.value }); }); }} />
          </div>
          <div style={{ marginBottom: 14 }}>
            <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: "#374151", marginBottom: 6 }}>Materiaux a livrer *</label>
            {lines.map(function(l, i) {
              var selProd = props.products.find(function(p) { return String(p.id) === String(l.productId); });
              return (
                <div key={i} style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                  <ProductSearch
                    products={props.products}
                    value={l.productId}
                    onChange={function(v) { setLines(function(p) { return p.map(function(x, j) { return j === i ? Object.assign({}, x, { productId: v }) : x; }); }); }}
                    placeholder="Rechercher..."
                  />
                  <input type="number" min="1" max={selProd ? selProd.stock : undefined} value={l.qty} onChange={function(e) { var v = e.target.value; setLines(function(p) { return p.map(function(x, j) { return j === i ? Object.assign({}, x, { qty: v }) : x; }); }); }} style={Object.assign({}, IS, { width: 60 })} />
                  <select value={l.unite} onChange={function(e) { var v = e.target.value; setLines(function(p) { return p.map(function(x, j) { return j === i ? Object.assign({}, x, { unite: v }) : x; }); }); }} style={Object.assign({}, IS, { width: 90 })}>
                    {UNITS.map(function(u) { return <option key={u} value={u}>{u}</option>; })}
                  </select>
                  <button onClick={function() { setLines(function(p) { return p.filter(function(_, j) { return j !== i; }); }); }} style={{ background: "#fef2f2", border: "none", color: "#ef4444", borderRadius: 8, cursor: "pointer", padding: "0 10px" }}>✕</button>
                </div>
              );
            })}
            <Btn small outline onClick={function() { setLines(function(p) { return p.concat([{ productId: "", qty: 1, unite: "palette" }]); }); }}>+ Ajouter</Btn>
          </div>
          <Txta label="Notes" value={form.notes} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { notes: e.target.value }); }); }} />
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Btn outline onClick={function() { setModal(false); }}>Annuler</Btn>
            <Btn onClick={submit}>Creer le bon</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}


// ─── COMPOSANT RECHERCHE PRODUIT ─────────────────────────────────────────────
function ProductSearch(props) {
  // props: products, value (productId), onChange(productId), placeholder
  var [query, setQuery] = useState("");
  var [open, setOpen] = useState(false);
  var selProd = props.products.find(function(p) { return String(p.id) === String(props.value); });

  // Quand un produit est déjà sélectionné, afficher son nom
  var displayVal = selProd ? selProd.name : query;

  var filtered = query.length >= 1
    ? props.products.filter(function(p) {
        return p.name.toLowerCase().indexOf(query.toLowerCase()) >= 0 ||
               (p.category || "").toLowerCase().indexOf(query.toLowerCase()) >= 0 ||
               String(p.id).toLowerCase().indexOf(query.toLowerCase()) >= 0;
      }).slice(0, 20)
    : [];

  function select(p) {
    props.onChange(String(p.id));
    setQuery("");
    setOpen(false);
  }

  function clear() {
    props.onChange("");
    setQuery("");
    setOpen(false);
  }

  return (
    <div style={{ position: "relative", flex: "2" }}>
      <div style={{ display: "flex", alignItems: "center", background: "#f8fafc", border: "1.5px solid #e2e8f0", borderRadius: 10, overflow: "hidden" }}>
        <input
          type="text"
          value={selProd ? selProd.name : query}
          placeholder={props.placeholder || "Rechercher un produit..."}
          onFocus={function() { if (selProd) { props.onChange(""); setQuery(""); } setOpen(true); }}
          onChange={function(e) { setQuery(e.target.value); setOpen(true); if (selProd) props.onChange(""); }}
          style={{ flex: 1, padding: "10px 12px", border: "none", outline: "none", fontSize: 13, background: "transparent" }}
        />
        {(selProd || query) && (
          <button onClick={clear} style={{ background: "none", border: "none", color: "#94a3b8", cursor: "pointer", padding: "0 10px", fontSize: 16 }}>✕</button>
        )}
        {!selProd && !query && <span style={{ padding: "0 10px", color: "#94a3b8", fontSize: 13 }}>🔍</span>}
      </div>
      {open && filtered.length > 0 && (
        <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: "#fff", border: "1.5px solid #e2e8f0", borderRadius: 10, boxShadow: "0 8px 24px #00000020", zIndex: 500, maxHeight: 220, overflowY: "auto", marginTop: 4 }}>
          {filtered.map(function(p) {
            return (
              <div key={p.id} onMouseDown={function() { select(p); }} onClick={function() { select(p); }}
                style={{ padding: "10px 14px", cursor: "pointer", borderBottom: "1px solid #f1f5f9", display: "flex", justifyContent: "space-between", alignItems: "center" }}
                onMouseEnter={function(e) { e.currentTarget.style.background = "#eff6ff"; }}
                onMouseLeave={function(e) { e.currentTarget.style.background = "transparent"; }}>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 13, color: "#1e293b" }}>{p.name}</div>
                  <div style={{ fontSize: 11, color: "#94a3b8" }}>{p.category} · {p.unit}</div>
                </div>
                <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 10 }}>
                  <div style={{ fontWeight: 700, fontSize: 13, color: "#1e3a8a" }}>{fmtE(p.price)}</div>
                  <div style={{ fontSize: 11, color: p.stock > 0 ? "#22c55e" : "#f59e0b" }}>Stock: {p.stock}</div>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {open && query.length >= 1 && filtered.length === 0 && (
        <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: "#fff", border: "1.5px solid #e2e8f0", borderRadius: 10, boxShadow: "0 8px 24px #00000020", zIndex: 500, padding: "14px", textAlign: "center", color: "#94a3b8", fontSize: 13, marginTop: 4 }}>
          Aucun produit pour "{query}"
        </div>
      )}
      {open && <div style={{ position: "fixed", inset: 0, zIndex: 499 }} onClick={function() { setOpen(false); }} />}
    </div>
  );
}

// ─── DEVIS ───────────────────────────────────────────────────────────────────
function Devis(props) {
  var [modal, setModal] = useState(false);
  var [sel, setSel] = useState(null);
  var [prt, setPrt] = useState(null);
  var [lines, setLines] = useState([{ productId: "", qty: 1 }]);
  var [form, setForm] = useState({ chantierId: "", date: new Date().toISOString().split("T")[0], client: "", validite: 30, notes: "" });

  function getUnitPrice(p, pr) {
    // Si customPrice est defini ET non vide ET > 0, on l utilise, sinon on prend le prix catalogue
    var custom = p.customPrice;
    if (custom !== undefined && custom !== "" && custom !== null && Number(custom) > 0) {
      return Number(custom);
    }
    return pr ? Number(pr.price) : 0;
  }
  function calcTot(d) {
    return (d.products || []).reduce(function(s, p) {
      var pr = props.products.find(function(x) { return String(x.id) === String(p.productId); });
      var unitPrice = getUnitPrice(p, pr);
      var margin = Number(d.margin || 0);
      var finalPrice = unitPrice * (1 + margin / 100);
      return s + (finalPrice * Number(p.qty));
    }, 0);
  }

  function submit() {
    if (!form.client || lines.some(function(l) { return !l.productId; })) return;
    var ref = gRef("DEV", props.devis);
    var d = { id: uid(), chantierId: form.chantierId || null, date: form.date, client: form.client, validite: form.validite, notes: form.notes, products: lines.map(function(l) { return { productId: String(l.productId), qty: Number(l.qty), customPrice: l.customPrice !== undefined ? Number(l.customPrice) : undefined }; }), status: "brouillon", ref: ref, createdBy: props.user.name, margin: Number(form.margin || 0) };
    props.setDevis(function(p) { return p.concat([d]); });
    props.addNotif("success", "Devis cree", ref);
    setModal(false);
    setLines([{ productId: "", qty: 1 }]);
    setForm({ chantierId: "", date: new Date().toISOString().split("T")[0], client: "", validite: 30, notes: "" });
  }

  function upSt(id, status) {
    props.setDevis(function(p) { return p.map(function(d) { return d.id === id ? Object.assign({}, d, { status: status }) : d; }); });
    setSel(function(p) { return p ? Object.assign({}, p, { status: status }) : null; });
  }

  if (prt) return <PrintModal html={prt} onClose={function() { setPrt(null); }} />;

  if (sel) {
    var d = props.devis.find(function(x) { return x.id === sel.id; }) || sel;
    var ch = findCh(props.chantiers, d.chantierId);
    var total = calcTot(d);
    return (
      <div>
        <button onClick={function() { setSel(null); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#3b82f6", fontWeight: 600, fontSize: 14, marginBottom: 16, padding: 0 }}>← Retour</button>
        <div style={{ background: "linear-gradient(135deg,#0f172a,#1e3a8a)", borderRadius: 16, padding: 20, color: "#fff", marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
            <div><div style={{ fontSize: 11, opacity: 0.8 }}>Devis</div><div style={{ fontSize: 22, fontWeight: 800 }}>{d.ref}</div></div>
            <Badge status={d.status} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Client</div><div style={{ fontWeight: 700 }}>{d.client || "—"}</div></div>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Chantier</div><div style={{ fontWeight: 700 }}>{ch ? ch.name : "—"}</div></div>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Date</div><div style={{ fontWeight: 700 }}>{fmtD(d.date)}</div></div>
            <div style={{ background: "#ffffff18", borderRadius: 10, padding: "10px 12px" }}><div style={{ fontSize: 11, opacity: 0.7 }}>Validite</div><div style={{ fontWeight: 700 }}>{d.validite} jours</div></div>
          </div>
        </div>
        <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 12, boxShadow: "0 2px 10px #00000010" }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 12 }}>Lignes du devis</div>
          {(d.products || []).map(function(p, i) {
            var pr = props.products.find(function(x) { return String(x.id) === String(p.productId); });
            var unitPrice = getUnitPrice(p, pr);
            var margin = Number(d.margin || 0);
            var finalPrice = unitPrice * (1 + margin / 100);
            return (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid #f1f5f9" }}>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{pr ? pr.name : "Produit #" + p.productId}</div>
                  <div style={{ fontSize: 12, color: "#64748b" }}>{p.qty} {pr ? pr.unit : ""}
                    {margin > 0 ? " · " + fmtE(unitPrice) + " + " + margin + "% = " + fmtE(finalPrice) : " · " + fmtE(unitPrice)}
                  </div>
                </div>
                <div style={{ fontWeight: 700, color: "#1e3a8a" }}>{fmtE(finalPrice * Number(p.qty))}</div>
              </div>
            );
          })}
          {d.margin > 0 && <div style={{ background: "#eff6ff", borderRadius: 8, padding: "6px 10px", fontSize: 12, color: "#1e3a8a", marginTop: 6 }}>📈 Marge commerciale appliquee : {d.margin}%</div>}
          <div style={{ marginTop: 12, paddingTop: 12, borderTop: "2px solid #e2e8f0" }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}><span style={{ color: "#64748b" }}>Total HT (avec marge)</span><span style={{ fontWeight: 700 }}>{fmtE(total)}</span></div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}><span style={{ color: "#64748b" }}>TVA 20%</span><span style={{ fontWeight: 700 }}>{fmtE(total * 0.2)}</span></div>
            <div style={{ display: "flex", justifyContent: "space-between", paddingTop: 8, borderTop: "1px solid #e2e8f0" }}><span style={{ fontWeight: 800, fontSize: 15 }}>Total TTC</span><span style={{ fontWeight: 800, fontSize: 18, color: "#1e3a8a" }}>{fmtE(total * 1.2)}</span></div>
          </div>
          {d.notes && <div style={{ marginTop: 10, padding: "8px 12px", background: "#f8fafc", borderRadius: 8, fontSize: 12, color: "#64748b" }}>📝 {d.notes}</div>}
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 12 }}>
          {d.status === "brouillon" && <button onClick={function() { upSt(d.id, "envoye"); props.addNotif("success", "Devis envoye", d.ref); }} style={{ width: "100%", padding: 13, borderRadius: 12, border: "none", cursor: "pointer", background: "#3b82f6", color: "#fff", fontWeight: 700 }}>📤 Marquer comme envoye</button>}
          {d.status === "envoye" && (
            <div>
              <button onClick={function() { upSt(d.id, "accepte"); props.addNotif("success", "Devis accepte !", d.ref); }} style={{ width: "100%", padding: 13, borderRadius: 12, border: "none", cursor: "pointer", background: "#22c55e", color: "#fff", fontWeight: 700, marginBottom: 8 }}>✅ Accepte par le client</button>
              <button onClick={function() { upSt(d.id, "refuse"); }} style={{ width: "100%", padding: 12, borderRadius: 12, border: "2px solid #ef4444", cursor: "pointer", background: "#fff", color: "#ef4444", fontWeight: 600 }}>❌ Refuse par le client</button>
            </div>
          )}
        </div>
        <button onClick={function() {
          var ch2 = findCh(props.chantiers, d.chantierId);
          var margin = Number(d.margin || 0);
          var rows = (d.products || []).map(function(p) {
            var pr = findProd(props.products, p.productId);
            var up = getUnitPrice(p, pr);
            var fp = up * (1 + margin / 100);
            var t = fp * Number(p.qty);
            return "<tr><td>" + (pr ? pr.name : "Produit #" + p.productId) + "</td><td style='text-align:center'>" + p.qty + " " + (pr ? pr.unit : "") + "</td><td style='text-align:right'>" + fmtE(fp) + (margin > 0 ? " (+" + margin + "%)" : "") + "</td><td style='text-align:right'>" + fmtE(t) + "</td></tr>";
          }).join("");
          var tot2 = calcTot(d);
          var info = "<div class='info'><strong>Client :</strong> " + d.client + (ch2 ? "<br><strong>Chantier :</strong> " + ch2.name + " — " + ch2.client : "") + "<br><strong>Cree par :</strong> " + (d.createdBy || "-") + (margin > 0 ? "<br><strong>Marge commerciale :</strong> " + margin + "%" : "") + (d.notes ? "<br><strong>Notes :</strong> " + d.notes : "") + "</div>";
          var totals = "<div class='total'><div>Total HT : " + fmtE(tot2) + "</div><div>TVA 20% : " + fmtE(tot2 * 0.2) + "</div><div class='ttc'>Total TTC : " + fmtE(tot2 * 1.2) + "</div></div>";
          setPrt(buildDocHtml(d.ref, "Devis - Validite " + d.validite + " jours - " + fmtD(d.date), info, rows, totals));
        }} style={{ width: "100%", padding: 12, borderRadius: 12, border: "2px solid #1e3a8a", background: "#fff", color: "#1e3a8a", fontWeight: 600, cursor: "pointer", marginBottom: 10 }}>🖨️ Apercu et Imprimer</button>
        {props.user.role === "admin" && <button onClick={function() { if (confirm("Supprimer ?")) { props.setDevis(function(p) { return p.filter(function(x) { return x.id !== d.id; }); }); setSel(null); } }} style={{ width: "100%", padding: 10, borderRadius: 12, border: "none", background: "#fef2f2", color: "#ef4444", fontWeight: 600, cursor: "pointer" }}>🗑️ Supprimer</button>}
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h1 style={{ fontSize: 24, fontWeight: 800, color: "#1e293b", margin: 0 }}>Devis</h1>
        <Btn onClick={function() { setModal(true); }}>+ Nouveau</Btn>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {props.devis.map(function(d) {
          var ch = findCh(props.chantiers, d.chantierId);
          var tot = calcTot(d);
          return (
            <div key={d.id} onClick={function() { setSel(d); }} style={{ background: "#fff", borderRadius: 14, padding: 16, boxShadow: "0 2px 10px #00000010", borderLeft: "4px solid " + (SC[d.status] || "#94a3b8"), cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}><div style={{ fontWeight: 800, fontSize: 15, color: "#1e3a8a" }}>{d.ref}</div><Badge status={d.status} /></div>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#374151" }}>👤 {d.client || "—"}</div>
              {ch && <div style={{ fontSize: 12, color: "#64748b" }}>🏗️ {ch.name}</div>}
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, paddingTop: 8, borderTop: "1px solid #f1f5f9" }}>
                <span style={{ fontSize: 12, color: "#64748b" }}>📅 {fmtD(d.date)} · {d.validite}j</span>
                <span style={{ fontWeight: 800, color: "#1e3a8a" }}>{fmtE(tot * 1.2)} TTC</span>
              </div>
            </div>
          );
        })}
        {props.devis.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#94a3b8" }}><div style={{ fontSize: 48 }}>📋</div><p>Aucun devis</p></div>}
      </div>
      {modal && (
        <Modal title="Nouveau devis" onClose={function() { setModal(false); }}>
          <Inp label="Client *" value={form.client} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { client: e.target.value }); }); }} placeholder="Nom du client" />
          <Sel label="Chantier" value={form.chantierId} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { chantierId: e.target.value }); }); }}>
            <option value="">-- Sans chantier --</option>
            {props.chantiers.map(function(c) { return <option key={c.id} value={String(c.id)}>{c.name} — {c.client}</option>; })}
          </Sel>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Inp label="Date" type="date" value={form.date} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { date: e.target.value }); }); }} />
            <Inp label="Validite (jours)" type="number" value={form.validite} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { validite: e.target.value }); }); }} />
          </div>
          <div style={{ marginBottom: 14 }}>
            <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: "#374151", marginBottom: 6 }}>Produits *</label>
            {lines.map(function(l, i) {
              var selProd = props.products.find(function(p) { return String(p.id) === String(l.productId); });
              var displayPrice = l.customPrice !== "" && l.customPrice !== undefined ? l.customPrice : (selProd ? selProd.price : "");
              return (
                <div key={i} style={{ marginBottom: 10 }}>
                  <div style={{ display: "flex", gap: 8, marginBottom: 4, alignItems: "center" }}>
                    <ProductSearch
                      products={props.products}
                      value={l.productId}
                      onChange={function(v) { setLines(function(p) { return p.map(function(x, j) { return j === i ? Object.assign({}, x, { productId: v, customPrice: "" }) : x; }); }); }}
                      placeholder="Rechercher un produit..."
                    />
                    <input type="number" min="1" value={l.qty} onChange={function(e) { var v = e.target.value; setLines(function(p) { return p.map(function(x, j) { return j === i ? Object.assign({}, x, { qty: v }) : x; }); }); }} style={Object.assign({}, IS, { width: 60 })} placeholder="Qte" />
                    <button onClick={function() { setLines(function(p) { return p.filter(function(_, j) { return j !== i; }); }); }} style={{ background: "#fef2f2", border: "none", color: "#ef4444", borderRadius: 8, cursor: "pointer", padding: "0 10px" }}>✕</button>
                  </div>
                  {l.productId && <div style={{ display: "flex", gap: 8, alignItems: "center", paddingLeft: 4 }}>
                    <label style={{ fontSize: 12, color: "#64748b", whiteSpace: "nowrap" }}>Prix unit. HT (€)</label>
                    <input type="number" min="0" step="0.01" value={displayPrice} placeholder={selProd ? String(selProd.price) : "0"} onChange={function(e) { var v = e.target.value; setLines(function(p) { return p.map(function(x, j) { return j === i ? Object.assign({}, x, { customPrice: v }) : x; }); }); }} style={Object.assign({}, IS, { width: 100, fontSize: 13 })} />
                    {selProd && <span style={{ fontSize: 11, color: "#94a3b8" }}>Catalogue: {fmtE(selProd.price)}</span>}
                  </div>}
                </div>
              );
            })}
            <div style={{ background: "#eff6ff", borderRadius: 8, padding: "8px 12px", marginBottom: 8 }}>
              <label style={{ fontSize: 12, fontWeight: 600, color: "#1e3a8a" }}>Marge commerciale globale (%)</label>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 4 }}>
                <input type="number" min="0" max="100" step="0.5" value={form.margin} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { margin: e.target.value }); }); }} style={Object.assign({}, IS, { width: 80 })} />
                <span style={{ fontSize: 12, color: "#64748b" }}>= +{fmtE(lines.reduce(function(s, l) { var p2 = props.products.find(function(x) { return String(x.id) === String(l.productId); }); var up = l.customPrice !== "" && l.customPrice !== undefined ? Number(l.customPrice) : (p2 ? p2.price : 0); return s + up * Number(l.qty || 0); }, 0) * Number(form.margin || 0) / 100)} de marge</span>
              </div>
            </div>
            <div style={{ textAlign: "right", fontWeight: 700, color: "#1e3a8a", margin: "6px 0" }}>
              Total HT : {fmtE(lines.reduce(function(s, l) { var p = props.products.find(function(x) { return String(x.id) === String(l.productId); }); var up = l.customPrice !== "" && l.customPrice !== undefined ? Number(l.customPrice) : (p ? p.price : 0); var fp = up * (1 + Number(form.margin || 0)/100); return s + fp * Number(l.qty || 0); }, 0))}
            </div>
            <Btn small outline onClick={function() { setLines(function(p) { return p.concat([{ productId: "", qty: 1, customPrice: "" }]); }); }}>+ Ajouter</Btn>
          </div>
          <Txta label="Notes" value={form.notes} onChange={function(e) { setForm(function(p) { return Object.assign({}, p, { notes: e.target.value }); }); }} />
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Btn outline onClick={function() { setModal(false); }}>Annuler</Btn><Btn onClick={submit}>Creer</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

        </div>
      )}
    </div>
  );
}
